# SPDX-License-Identifier: MPL-2.0
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck
        run: shellcheck run.sh scripts/*.sh

      - name: Tutorials have one title each
        run: |
          set -euo pipefail
          for f in gcp.md gcp-firebase.md upgrade-gcp.md upgrade-gcp-firebase.md; do
            n="$(grep -c '^# ' "${f}")"
            [ "${n}" = 1 ] || { echo "::error file=${f}::${n} H1 headings (a Cloud Shell tutorial has exactly one)"; exit 1; }
          done

      - name: Upgrade tutorials run the upgrade, never the installer
        run: |
          set -euo pipefail
          for f in upgrade-gcp.md upgrade-gcp-firebase.md; do
            grep -q '^\./run\.sh upgrade$' "${f}" || { echo "::error file=${f}::no ./run.sh upgrade command block"; exit 1; }
            if grep -qE '^\./run\.sh gcp' "${f}"; then echo "::error file=${f}::runs the installer"; exit 1; fi
          done

      - name: run.sh upgrade refuses bad arguments before downloading anything
        run: |
          set -uo pipefail
          expect_fail() {
            local want="$1"; shift
            out="$("$@" 2>&1)" && { echo "::error::$* succeeded"; exit 1; }
            grep -q -- "${want}" <<<"${out}" || { echo "::error::$*: expected '${want}', got: ${out}"; exit 1; }
            grep -q "Bun " <<<"${out}" && { echo "::error::$* downloaded tools before refusing"; exit 1; }
            true
          }
          expect_fail "takes only --project, --install and --version" ./run.sh upgrade --skip-verify
          expect_fail "--project needs a value" ./run.sh upgrade --project
          expect_fail "--install needs a value" ./run.sh upgrade --install --project p
          expect_fail "never runs Pulumi" ./run.sh upgrade --local
          expect_fail "--version needs a value" ./run.sh upgrade --version
          expect_fail "not a stable Caelo version" ./run.sh --verify-only --version 1.0
          ./run.sh --help | grep -q "run.sh upgrade"

      - name: Nothing pins a Caelo version
        # The install buttons always install the newest release; a version
        # constant here would need a commit per release again.
        run: |
          set -euo pipefail
          if grep -nE '^CAELO_VERSION="[0-9]' run.sh; then echo "::error file=run.sh::run.sh pins a Caelo version"; exit 1; fi
          if grep -nE 'cloudshell_git_branch=release-v' README.md; then echo "::error file=README.md::an install button names one release"; exit 1; fi

      - name: Button blocks render
        run: |
          set -euo pipefail
          scripts/buttons.sh | grep -q "cloudshell_git_branch=main&"
          scripts/buttons.sh 0.0.1 | grep -q "cloudshell_git_branch=release-v0.0.1&"
          # README's block is exactly what the script prints.
          diff <(sed -n '/<!-- buttons:start -->/,/<!-- buttons:end -->/p' README.md | sed '1d;$d') <(scripts/buttons.sh)

      - name: run.sh resolves and verifies the newest release
        run: |
          set +e
          out="$(./run.sh --verify-only 2>&1)"
          code=$?
          echo "${out}"
          set -e
          grep -q "the newest stable release on npm" <<<"${out}"
          # 3: the release predates the install job.
          [ "${code}" = 0 ] || [ "${code}" = 3 ]
