# SPDX-License-Identifier: MPL-2.0
#
# Give the newest stable Caelo release its `release-v<version>` branch
# (epic caelo-cms/caelo-cms#696).
#
# Nothing here pins a version: run.sh on `main` resolves the newest stable
# release itself (the npm `latest` dist-tag), so the install buttons always
# install the newest release. The branch exists only for links that need ONE
# release: Settings → Updates in the admin opens `release-v<target>` with the
# upgrade walkthrough, and run.sh on that branch takes the version from the
# branch name. The branch is a plain pointer to main at the time the release
# was verified; no commit is written for it.
#
# Polls caelo-cms/caelo-cms for its latest stable GitHub Release — created
# only after that release's npm packages, images and signed manifest are
# published — and verifies it with `run.sh --verify-only --version <v>`
# (checksum-pinned tools, `npm audit signatures`, provenance naming
# caelo-cms/caelo-cms on the tag) before the branch is created.
#
# Polling instead of a cross-repository dispatch on purpose: a dispatch from
# caelo-cms's release workflow would need a long-lived token with write
# access to this repository. This workflow needs only its own GITHUB_TOKEN
# (read public releases, write this repository).

name: track-release

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Caelo version to give a branch (e.g. 0.10.47). Default: the latest stable release."
        required: false

permissions:
  contents: write

concurrency:
  group: track-release
  cancel-in-progress: false

jobs:
  branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Which release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION}" ]; then
            v="${INPUT_VERSION#v}"
          else
            tag="$(gh release view --repo caelo-cms/caelo-cms --json tagName --jq .tagName)"
            v="${tag#v}"
          fi
          if ! [[ "${v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::not a stable version: ${v}"
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "release-v${v}" >/dev/null; then
            echo "release-v${v} exists already."
            echo "todo=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "version=${v}" >> "${GITHUB_OUTPUT}"
          echo "todo=true" >> "${GITHUB_OUTPUT}"

      - name: Verify the release (checksums, npm signatures + provenance)
        id: verify
        if: steps.rel.outputs.todo == 'true'
        env:
          V: ${{ steps.rel.outputs.version }}
        run: |
          set +e
          ./run.sh --verify-only --version "${V}"
          code=$?
          set -e
          if [ "${code}" = 3 ]; then
            echo "::notice::v${V} predates the Cloud Shell install; no branch."
            echo "branch=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          [ "${code}" = 0 ] || exit "${code}"
          echo "branch=true" >> "${GITHUB_OUTPUT}"

      - name: Create release-v<version>
        if: steps.verify.outputs.branch == 'true'
        env:
          V: ${{ steps.rel.outputs.version }}
        run: |
          set -euo pipefail
          # Every release branch ships both walkthroughs; the admin links the
          # upgrade one, so a branch without it is a bug.
          for f in gcp.md gcp-firebase.md upgrade-gcp.md upgrade-gcp-firebase.md; do
            [ -f "${f}" ] || { echo "::error::${f} is missing; refusing to create release-v${V}"; exit 1; }
          done
          git push origin "HEAD:refs/heads/release-v${V}"
          echo "Created https://github.com/${GITHUB_REPOSITORY}/tree/release-v${V}" >> "${GITHUB_STEP_SUMMARY}"
